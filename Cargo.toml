[package]
name = "component-search-searxng"
description = "Search the web through a self-hosted SearXNG instance"
version = "0.1.1"
edition = "2024"
keywords = ["act", "search", "searxng", "websearch", "wasm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/actpkg/search-searxng"

[dependencies]
act-sdk = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# `default-features = false` drops cookies/cache/decompression this tool
# does not use; `idn` stays on so self-hosted instances on non-ASCII
# (.рф, .дети) hostnames resolve.
hclient = { version = "0.1.0-alpha.18", default-features = false, features = ["idn"] }
hclient-wasi = "0.1.5"
form_urlencoded = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[lib]
crate-type = ["cdylib"]
